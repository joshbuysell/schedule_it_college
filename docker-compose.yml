services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
      POSTGRES_DB: schedule
    volumes:
      - schedule-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "schedule"]
      interval: 5s
      retries: 10

  schedule:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://schedule:schedule@db:5432/schedule
      DATABASE_URL_UNPOOLED: postgresql://schedule:schedule@db:5432/schedule
      AUTH_SECRET: ${AUTH_SECRET:?задайте AUTH_SECRET у .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@itcollege.lviv.ua}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD у .env}
      PUBLIC_URL: ${PUBLIC_URL:-}

volumes:
  schedule-db:
