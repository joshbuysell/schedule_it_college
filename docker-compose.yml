services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rozklad
      POSTGRES_PASSWORD: rozklad
      POSTGRES_DB: rozklad
    volumes:
      - rozklad-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rozklad"]
      interval: 5s
      retries: 10

  rozklad:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://rozklad:rozklad@db:5432/rozklad
      DATABASE_URL_UNPOOLED: postgresql://rozklad:rozklad@db:5432/rozklad
      AUTH_SECRET: ${AUTH_SECRET:?задайте AUTH_SECRET у .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@itcollege.lviv.ua}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD у .env}
      PUBLIC_URL: ${PUBLIC_URL:-}

volumes:
  rozklad-db:
