name: Резервна копія бази

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Перевірити секрети
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Задайте секрети DATABASE_URL і BACKUP_PASSPHRASE у Settings → Secrets → Actions"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: pg_dump
        if: env.SKIP != '1'
        run: docker run --rm -e DATABASE_URL postgres:17-alpine sh -c 'pg_dump "$DATABASE_URL" --no-owner --no-privileges --format=custom' > schedule.dump
      - name: Зашифрувати
        if: env.SKIP != '1'
        run: |
          test -s schedule.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "schedule-$(date -u +%F).dump.gpg" schedule.dump
          rm schedule.dump
      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1'
        with:
          name: schedule-backup-${{ github.run_number }}
          path: "*.dump.gpg"
          retention-days: 30
